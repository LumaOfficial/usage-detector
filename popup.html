<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Usage Detector</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; width: 280px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; }
      .muted { color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Today's usage</h1>
    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>No usage recorded yet.</p>
    <script src="popup.js"></script>
  </body>
</html>
