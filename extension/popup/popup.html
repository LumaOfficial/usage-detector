<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Detector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i></span>
    <div class="brand-text">
      <h1>Usage Detector</h1>
      <p id="subtitle">Claude &amp; ChatGPT limits</p>
    </div>
  </div>
  <button id="refresh" class="icon-btn" type="button" title="Refresh" aria-label="Refresh usage">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3.2-6.9"></path>
      <path d="M21 3v6h-6"></path>
    </svg>
  </button>
</header>

<main id="providers" class="providers" aria-live="polite"></main>

<footer class="foot">
  <button class="link" type="button" data-open="claude">Open claude.ai</button>
  <span class="dot" aria-hidden="true"></span>
  <button class="link" type="button" data-open="chatgpt">Open chatgpt.com</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
