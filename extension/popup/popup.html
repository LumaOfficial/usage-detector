<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Detector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i></span>
    <div class="brand-text">
      <h1>Usage Detector</h1>
      <p id="subtitle">Claude &amp; ChatGPT limits</p>
    </div>
  </div>
  <div class="head-actions">
    <button id="settings" class="icon-btn" type="button" title="Settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"></path>
      </svg>
    </button>
    <button id="refresh" class="icon-btn" type="button" title="Refresh" aria-label="Refresh usage">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"></path>
        <path d="M21 3v6h-6"></path>
      </svg>
    </button>
  </div>
</header>

<main id="providers" class="providers" aria-live="polite"></main>

<footer class="foot">
  <button class="link" type="button" data-open="claude">Open claude.ai</button>
  <span class="dot" aria-hidden="true"></span>
  <button class="link" type="button" data-open="chatgpt">Open chatgpt.com</button>
</footer>

<script src="../settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
