<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usage Detector</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #f2f3f5;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #14171d;
      }
      .pages {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
        justify-content: center;
      }
      iframe {
        display: block;
        border: 1px solid #dcdfe4;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }
      #popup-frame { width: 320px; height: 260px; }
      #options-frame { width: 480px; height: 300px; }
    </style>
  </head>
  <body>
    <div class="pages">
      <iframe id="popup-frame" title="Usage Detector panel"></iframe>
      <iframe id="options-frame" title="Usage Detector settings"></iframe>
    </div>
    <script src="/preview/preview.js"></script>
  </body>
</html>
