<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Usage Detector — Options</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
      label { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .field { margin-bottom: 16px; }
      .field input { width: 90px; padding: 4px 6px; }
      button { padding: 6px 12px; }
      #status { color: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Usage Detector</h1>
    <label>
      <input type="checkbox" id="enabled" />
      Track AI credit usage
    </label>
    <div class="field">
      <label for="budget" style="display:block; margin-bottom:4px;">Daily credit budget (0 = no limit)</label>
      <input type="number" id="budget" min="0" step="1" />
    </div>
    <button id="clear">Clear recorded usage</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
